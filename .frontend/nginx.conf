server {
    listen 80;
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
    # index.html is never cached, so every page load re-fetches it and
    # picks up the new hashed asset URLs after a rebuild — no hard refresh.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
    # Built assets have content-hashed filenames, so they can be cached
    # forever without ever serving stale code.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
    location /api/ {
        proxy_pass http://backend:5000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
